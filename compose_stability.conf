// Types the Compose compiler should treat as STABLE but can't infer on its own (external types, or
// value types it can't see through). Marking them stable prevents false "unstable" labels that cause
// unnecessary recomposition. Verify with: ./gradlew assembleDebug -Pcompose.metrics
// then read each module's build/compose-reports/*-composables.txt.

// Domain value types passed into composables (immutable data classes / value classes).
com.paymentslab.core.paymentsapi.Money
com.paymentslab.core.paymentsapi.GatewayId
com.paymentslab.core.paymentsapi.PaymentStatus
com.paymentslab.core.paymentsapi.RedactedPayload

// kotlinx immutable collections — stable by contract, but the compiler needs telling.
kotlinx.collections.immutable.ImmutableList
kotlinx.collections.immutable.ImmutableSet
kotlinx.collections.immutable.ImmutableMap

// kotlinx-datetime + stdlib tuples used in UI models.
kotlinx.datetime.*
kotlin.Pair
kotlin.Triple
