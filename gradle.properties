# ── Gradle daemon JVM (build tooling) ────────────────────────────────────────
# Sized for a multi-module KMP + Compose + R8 build.
org.gradle.jvmargs=-Xmx6g -Xms2g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g

# ── Build parallelism and caching ────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
# configureondemand deliberately NOT enabled (was `true` until 2026-08-13). With it on this build
# emits, for :web and every other KMP module:
#   "Kotlin targets do not support Configuration on Demand ... This may lead to unpredictable and
#    inconsistent behaviour during a Gradle build." (KT-52074)
# Mileway and HireSignal both reached this conclusion already; PaymentsLab was the odd one out.
# The configuration cache below provides the speedup CoD was there for, without the correctness
# caveat — so this is a straight removal of risk, not a trade.
org.gradle.configureondemand=false
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Bleeding-edge: parallelize configuration-cache store/load across projects.
org.gradle.configuration-cache.parallel=true

# ── Android ───────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# ── Kotlin compiler ───────────────────────────────────────────────────────────
kotlin.incremental=true
kotlin.incremental.native=true
kotlin.mpp.stability.nowarn=true
kotlin.build.report.output=file
