# ── Daemon JVM ───────────────────────────────────────────────────────────────
# The whole build runs on JDK 21: modern (matches the wider codebase), and — unlike JDK 23+ —
# compatible with detekt 1.23.x, which rejects newer runtimes. All jvm targets are pinned to 21.
# NOTE: both paths below are machine-specific (keg-only Homebrew openjdk@21, not symlinked into
# /Library/Java). On another machine / CI, point them at a local JDK 21 or drop these lines and
# launch with `JAVA_HOME=<jdk21> ./gradlew`. installations.paths lets the Kotlin/Java toolchains
# resolve the same JDK 21 for compilation; java.home sets the daemon (needed because Gradle's daemon
# criteria only enforces a *minimum* version and so can't force a downgrade off JDK 25).
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home

# ── Gradle daemon JVM (build tooling) ────────────────────────────────────────
# Sized for a multi-module KMP + Compose + R8 build (matches the Dice production app's tuning).
org.gradle.jvmargs=-Xmx6g -Xms2g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g

# ── Build parallelism and caching ────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ── Android ───────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# ── Kotlin compiler ───────────────────────────────────────────────────────────
kotlin.incremental=true
kotlin.incremental.native=true
kotlin.mpp.stability.nowarn=true
kotlin.build.report.output=file
