# ── Daemon JVM ───────────────────────────────────────────────────────────────
# The whole build runs on JDK 17: it is the floor AGP 9.2 / Kotlin 2.4 / Gradle 9.6 all support, and
# — unlike JDK 23+ — it is compatible with detekt 1.23.x (which rejects newer runtimes). All jvm
# targets are pinned to 17 to match. NOTE: this path is machine-specific; on another machine / CI,
# point it at a local JDK 17 or remove this line and launch with `JAVA_HOME=<jdk17> ./gradlew`.
# (The portable `gradle/gradle-daemon-jvm.properties` only enforces a *minimum* version, so it can't
# force the 25→17 downgrade detekt needs — hence the explicit home here.)
org.gradle.java.home=/Users/darkpandawarrior/Library/Java/JavaVirtualMachines/ms-17.0.19/Contents/Home

# ── Gradle daemon JVM (build tooling) ────────────────────────────────────────
org.gradle.jvmargs=-Xmx4g -Xms1g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g

# ── Build parallelism and caching ────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ── Android ───────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# ── Kotlin compiler ───────────────────────────────────────────────────────────
kotlin.incremental=true
kotlin.incremental.native=true
kotlin.mpp.stability.nowarn=true
kotlin.build.report.output=file
