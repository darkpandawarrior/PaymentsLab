build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    # Compose entry-point composables legitimately take host + nav callbacks + modifier + VM default.
    functionThreshold: 10
    constructorThreshold: 10
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: true
    threshold: 20

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: true
    max: 5
  UnusedPrivateMember:
    active: true
  ForbiddenComment:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludeCommentStatements: true
  WildcardImport:
    active: true
    excludeImports:
      - 'java.util.*'
      - 'kotlinx.coroutines.*'

naming:
  FunctionNaming:
    active: true
    # Compose @Composable functions are PascalCase by convention.
    ignoreAnnotated: [ 'Composable' ]
  TopLevelPropertyNaming:
    active: true
  # We intentionally group small related declarations per file (e.g. a composable + its UI enum,
  # a catalog + its item type) — consistent with the disabled ktlint filename rule.
  MatchingDeclarationName:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
