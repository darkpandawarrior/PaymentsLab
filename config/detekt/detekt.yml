config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    active: true
    allowedLines: 80
  LongParameterList:
    active: true
    # Compose entry-point composables legitimately take host + nav callbacks + modifier + VM default.
    allowedFunctionParameters: 10
    allowedConstructorParameters: 10
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 20

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: true
    max: 5
  UnusedPrivateClass:
    active: true
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  ForbiddenComment:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludeCommentStatements: true
  WildcardImport:
    active: true
    excludeImports:
      - 'java.util.*'
      - 'kotlinx.coroutines.*'

naming:
  FunctionNaming:
    active: true
    # Compose @Composable functions are PascalCase by convention.
    ignoreAnnotated: [ 'Composable' ]
  TopLevelPropertyNaming:
    active: true
  # We intentionally group small related declarations per file (e.g. a composable + its UI enum,
  # a catalog + its item type) — consistent with the disabled ktlint filename rule.
  MatchingDeclarationName:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
