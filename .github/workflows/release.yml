name: Release

# Tag a commit `vX.Y.Z` to cut a release: runs the full gate, builds the release APK, and publishes
# a GitHub Release with the artifact. The APK is UNSIGNED — a public sandbox repo ships no keystore;
# add a signing config + secret to sign for real distribution (see fastlane/Fastfile).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI JDK 21 (strip machine-specific java.home)
        run: sed -i '/^org\.gradle\.java\.home/d; /^org\.gradle\.java\.installations\.paths/d' gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 37 platform & build-tools
        run: yes | sdkmanager "platforms;android-37" "build-tools;37.0.0" >/dev/null || true

      - run: chmod +x ./gradlew

      - name: Verification gate
        run: ./gradlew fastGate

      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            Automated release from tag `${{ github.ref_name }}`.

            > The attached APK is **unsigned** (this sandbox repo ships no keystore). Sign it, or add a
            > signing config + `PLAY_SERVICE_ACCOUNT_JSON` secret and use the Fastlane Play lane, to
            > distribute.
