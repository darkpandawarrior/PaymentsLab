name: Deploy to Aptoide

# Uploads the release APK via Aptoide Connect's Uploader API (single multipart POST, no community
# action needed). Gated on APTOIDE_API_KEY: no Aptoide Connect account/API key exists yet, so this
# job no-ops until configured.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRET: ${{ secrets.APTOIDE_API_KEY != '' }}
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_SECRET == 'true'
        with:
          submodules: recursive

      - name: Set up JDK 21
        if: env.HAS_SECRET == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI JDK 21 (strip machine-specific java.home)
        if: env.HAS_SECRET == 'true'
        run: sed -i '/^org\.gradle\.java\.home/d; /^org\.gradle\.java\.installations\.paths/d' gradle.properties

      - name: Setup Gradle
        if: env.HAS_SECRET == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        if: env.HAS_SECRET == 'true'
        uses: android-actions/setup-android@v3

      - run: chmod +x ./gradlew
        if: env.HAS_SECRET == 'true'

      - name: Materialize signing secrets
        if: env.HAS_SECRET == 'true'
        run: |
          set -euo pipefail
          mkdir -p secrets
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > secrets/release.keystore
            {
              echo "RELEASE_STORE_FILE=$PWD/secrets/release.keystore"
              echo "RELEASE_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD:-}"
              echo "RELEASE_KEY_ALIAS=${ANDROID_KEY_ALIAS:-paymentslab}"
              echo "RELEASE_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-}"
            } >> "$GITHUB_ENV"
          fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK
        if: env.HAS_SECRET == 'true'
        run: ./gradlew :app:assembleRelease

      - name: Upload to Aptoide
        if: env.HAS_SECRET == 'true'
        run: |
          set -euo pipefail
          curl -sf -X POST "https://uploader.catappult.io/api" \
            -H "Api-Key: ${APTOIDE_API_KEY}" \
            -F "apk=@app/build/outputs/apk/release/app-release.apk"
        env:
          APTOIDE_API_KEY: ${{ secrets.APTOIDE_API_KEY }}
